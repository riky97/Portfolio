<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Riccardo Ingrasciotta — Software Engineer specialized in React, front-end architecture and data monitoring systems." />
    <script>
      // Apply the saved preferences before the first paint, so the page never
      // flashes the wrong theme or language. Dark is the default; only an explicit
      // "light" choice removes the class.
      try {
        var root = document.documentElement;
        if (localStorage.getItem("theme") === "light") root.classList.remove("dark");
        if (localStorage.getItem("locale") === "it") root.lang = "it";
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Riccardo Ingrasciotta — Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
